[package]
name = "raytracing_in_one_weekend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ash = "0.38.0"
cgmath = {git="https://github.com/rustgd/cgmath.git", features=["bytemuck"]}
